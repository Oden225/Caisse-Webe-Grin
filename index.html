<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ma Cotisation</title>
<meta name="description" content="Suivi des cotisations mensuelles de l'association">
<meta name="theme-color" content="#173B61">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-vue="accueil">
  <header id="app-bar"></header>
  <main id="contenu"></main>

  <nav id="nav-bas" aria-label="Navigation principale">
    <button data-onglet="accueil"><span class="pastille"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Accueil</button>
    <button data-onglet="membres"><span class="pastille"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.2.7 3.5 2.8 3.5 5.7"/></svg></span>Membres</button>
    <button data-onglet="paiements"><span class="pastille"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Paiements</button>
    <button data-onglet="rapports"><span class="pastille"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>Rapports</button>
  </nav>

  <dialog id="dlg" aria-labelledby="dlg-titre">
    <h2 id="dlg-titre"></h2>
    <div id="dlg-corps"></div>
    <div id="dlg-boutons"></div>
  </dialog>

  <div id="verrou" hidden>
    <svg class="ic" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <div class="pin-asso"></div>
    <div>Entrez votre code</div>
    <div class="pin-points"></div>
    <div class="clavier"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/jspdf.plugin.autotable.min.js"></script>
  <script src="js/donnees.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/rapports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
